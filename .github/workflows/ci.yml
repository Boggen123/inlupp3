name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inlupp3

    steps:
      - uses: actions/checkout@v4

      - name: Clean previous build
        run: make clean

      - name: Compile project
        run: make all

      - name: Run tests
        run: make test
        